apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Oliver2087/redis-lab.git
    targetRevision: main
    path: charts/redis-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

