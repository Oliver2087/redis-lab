# platform/traefik-values.yaml
# This file contains the values for the Traefik Helm chart used in the lab.

# Traffic path on kind:
#   laptop :80  -> kind extraPortMapping -> control-plane node :80
#   -> hostPort 80 -> Traefik container :8000 ("web" entrypoint)
#   -> Gateway listener (port 8000) -> HTTPRoute -> Service -> Pod

# Run Traefik on the node that has ports 80/443 mapped from your laptop.
nodeSelector:
  ingress-ready: "true"

# That node is the control-plane, which normally refuses regular workloads
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# No cloud load balancer on kind: traffic arrives through the hostPorts below
service:
  spec:
    type: ClusterIP

ports:
  web:
    hostPort: 80     # node port 80 -> Traefik's web entrypoint (container port 8000)
  websecure:
    hostPort: 443    # node port 443 -> Traefik's websecure entrypoint (container port 8443)

providers:
  kubernetesGateway:
    enabled: true    # read Gateway API objects (Gateway, HTTPRoute)
    statusAddress:
      ip: "127.0.0.1"  # how the Gateway is reached on kind (via port mappings)
  kubernetesIngress:
    enabled: false   # we do not use the older Ingress API

ingressClass:
  enabled: false     # no Ingress API, hence no IngressClass

gatewayClass:
  enabled: true      # creates the GatewayClass "traefik"

gateway:
  enabled: false     # we define our own Gateway in platform/gateway.yaml