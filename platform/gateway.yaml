# platform/gateway.yaml
# The Gateway: the cluster's front door owned by the platform
# It listens for HTTP on Traefik's web entrypoint and accepts routes from any namespace.
# Apps attach to it with HTTPRoutes

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: traefik
spec:
  gatewayClassName: traefik    # Handled by the Traefik controller
  listeners:
    - name: web
      protocol: HTTP
      port: 8000      # must match Traefik's web entrypoint port
      allowedRoutes:
        namespaces:
          from: All   # HTTPRoutes in any namespace may attach